name: Deploy VleisKraft™ API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build API
        working-directory: api
        run: npm run build
        env:
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          NODE_ENV: production

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: vleiskraft

      - name: Health check
        id: health
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vleiskraft-api.onrender.com/api/health || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Health check: $STATUS"
        continue-on-error: true

      - name: Notify Slack on Deploy
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#vcds-ops",
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *VleisKraft™ API Deploy* — `${{ github.ref_name }}` by ${{ github.actor }}\nHealth: ${{ steps.health.outputs.status }}\nCommit: ${{ github.event.head_commit.message }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
