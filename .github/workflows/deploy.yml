name: Deploy VleisKraft™ API

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Build API
        working-directory: api
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Render
        run: |
          curl -s "https://api.render.com/v1/services/srv-d898vojbc2fs73eut49g/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

      - name: Health check
        id: health
        run: |
          sleep 45
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://vcds-vleiskraft.onrender.com/api/health || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Health: $STATUS"
        continue-on-error: true

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#vcds-ops",
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *VleisKraft™ API Deploy* — `${{ github.ref_name }}` by ${{ github.actor }}\nHealth: ${{ steps.health.outputs.status }}\nCommit: ${{ github.event.head_commit.message }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Notify Slack on Deploy
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'vcds-ops'
          slack-message: |
            *${{ github.repository }}* deploy ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}
            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

