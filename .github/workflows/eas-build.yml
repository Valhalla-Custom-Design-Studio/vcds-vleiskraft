name: EAS APK Build — VleisKraft™

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: false
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  eas-build:
    name: Build APK VleisKraft™
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: ${{ github.event.inputs.profile || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: react_native_space/package-lock.json

      - name: Install dependencies
        working-directory: react_native_space
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: react_native_space
        run: eas build --platform android --profile ${{ env.BUILD_PROFILE }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}
          EXPO_PUBLIC_SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
          EXPO_PUBLIC_SENTRY_DSN_IOS: ${{ secrets.SENTRY_DSN_IOS }}
          EXPO_PUBLIC_SENTRY_DSN_REACT: ${{ secrets.SENTRY_DSN_REACT }}
          EXPO_PUBLIC_SENTRY_DSN_FLUTTER: ${{ secrets.SENTRY_DSN_FLUTTER }}
          EXPO_PUBLIC_ENV: production

      - name: Notify Slack on Build
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: "vcds-ops"
          payload: |
            {
              "channel": "#vcds-ops",
              "text": "${{ job.status == 'success' && '✅' || '❌' }} *VleisKraft™ APK Build* — `${{ env.BUILD_PROFILE }}` — ${{ job.status }}\nTriggered by: ${{ github.actor }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
