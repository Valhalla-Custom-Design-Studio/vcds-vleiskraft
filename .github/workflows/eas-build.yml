name: EAS APK Build — VleisKraft

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview=APK, production=AAB)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches: [main]
    paths:
      - 'react_native_space/app/**'
      - 'react_native_space/src/**'
      - 'react_native_space/package.json'
      - 'react_native_space/app.json'

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react_native_space/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: react_native_space

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
        working-directory: react_native_space
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅' || '🔴' }} *VleisKraft APK Build* queued on EAS\nProfile: `${{ github.event.inputs.profile || 'preview' }}`\nActor: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
